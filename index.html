<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할일 목록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 인증 화면 (비로그인 시 표시) -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="material-icons-round">task_alt</span>
        <h2>할일 목록</h2>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab auth-tab-active" data-mode="signin">로그인</button>
        <button class="auth-tab" data-mode="signup">회원가입</button>
      </div>
      <div class="text-field">
        <span class="material-icons-round text-field-icon">email</span>
        <input type="email" id="auth-email" placeholder="이메일" autocomplete="email">
      </div>
      <div class="text-field">
        <span class="material-icons-round text-field-icon">lock</span>
        <input type="password" id="auth-password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
        <button class="pw-toggle" id="pw-toggle" tabindex="-1" type="button">
          <span class="material-icons-round" id="pw-toggle-icon">visibility</span>
        </button>
      </div>
      <div class="auth-divider">
        <span class="auth-divider-line"></span>
        <span class="auth-divider-text">또는</span>
        <span class="auth-divider-line"></span>
      </div>
      <button id="google-btn" class="social-btn social-btn-google" type="button">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google로 계속하기
      </button>
      <button id="github-btn" class="social-btn social-btn-github" type="button">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        GitHub으로 계속하기
      </button>
      <p id="auth-error" class="auth-error"></p>
      <button id="auth-submit" class="filled-btn auth-submit-btn">
        <span class="btn-label">로그인</span>
      </button>
    </div>
  </div>

  <header class="top-app-bar">
    <div class="top-app-bar-row">
      <span class="material-icons-round app-icon">task_alt</span>
      <h1 class="app-title">할일 목록</h1>
      <div class="user-area app-hidden" id="user-area">
        <span class="user-email" id="user-email"></span>
        <button class="icon-btn" id="logout-btn" title="로그아웃">
          <span class="material-icons-round">logout</span>
        </button>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="input-card app-hidden" role="form" aria-label="할일 추가">
      <div class="text-field">
        <span class="material-icons-round text-field-icon">edit_note</span>
        <input type="text" id="todo-input" placeholder="새 할일을 입력하세요" autocomplete="off" aria-label="할일 내용">
      </div>
      <div class="input-actions">
        <div class="chip-group" role="radiogroup" aria-label="우선순위">
          <button class="chip" data-priority="high" role="radio" aria-checked="false">
            <span class="material-icons-round">keyboard_double_arrow_up</span>높음
          </button>
          <button class="chip chip-active" data-priority="medium" role="radio" aria-checked="true">
            <span class="material-icons-round">remove</span>중간
          </button>
          <button class="chip" data-priority="low" role="radio" aria-checked="false">
            <span class="material-icons-round">keyboard_double_arrow_down</span>낮음
          </button>
        </div>
        <button id="add-btn" class="filled-btn">
          <span class="material-icons-round">add</span>
          <span class="btn-label">추가</span>
        </button>
      </div>
    </div>

    <div id="todo-sections" class="todo-sections app-hidden"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js" defer></script>
</body>
</html>
